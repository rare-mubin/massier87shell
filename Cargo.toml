[package]
name = "massier87shell"
version = "1.0.0"
edition = "2024"
description = "massier87shell: a customizable, lightweight top bar shell for Windows 11"
license = "MIT"

[dependencies]
chrono = "0.4.45"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit",
    "renderer-skia",        # Skia on Direct3D: hardware accelerated
    "renderer-femtovg",     # OpenGL
    "renderer-software",    # CPU fallback
    "raw-window-handle-06",
    "unstable-winit-030",
] }
toml = "1.1.6"
toml_edit = "0.25.15"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_RemoteDesktop",
    "Win32_System_Variant",
    "Win32_System_Console",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Media_Control",
    "Devices_Radios",
    "Foundation_Collections",
    "Win32_System_Wmi",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Graphics_Imaging",
    "Win32_Devices_FunctionDiscovery",
    "Foundation",
] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
